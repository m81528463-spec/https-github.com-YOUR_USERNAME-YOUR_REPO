name = "satisfactionforu-test"
main = "worker.js"
compatibility_date = "2026-10-16"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Test-only branch config. Production Worker is already bound to a live SFU_DATA namespace.
# Keep this separate from production and verify the intended namespace before deployment.
[[kv_namespaces]]
binding = "SFU_DATA"
id = "65afcc5931c64226bd829eaaa83a341a"
