<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Satisfaction for U — Admin</title>
  <style>
    :root {
      --bg: #fff7fc;
      --card: #ffffff;
      --ink: #2f1d2a;
      --muted: #765a6f;
      --pink: #d94f8b;
      --pink-strong: #c93a77;
      --line: #f2d9e7;
      --success: #eafaf0;
      --danger: #ffe8ee;
      --shadow: 0 18px 45px rgba(156, 65, 108, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: linear-gradient(140deg, #fff7fc, #fffafc 42%, #fff2f9 100%);
      color: var(--ink);
    }
    header {
      background: rgba(255,247,252,.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      text-align: center;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      margin-bottom: 18px;
    }
    .hidden { display: none !important; }
    .login {
      max-width: 520px;
      margin: 32px auto 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    label {
      display: block;
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, textarea, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 11px 12px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      background: var(--pink);
      color: white;
      border: none;
      font-weight: 700;
      letter-spacing: .03em;
    }
    button.secondary {
      background: #fff;
      color: var(--pink-strong);
      border: 1px solid var(--line);
    }
    button.danger {
      background: #f5a8bb;
      color: #5c2335;
    }
    .inline-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .status {
      margin-top: 12px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .9rem;
      color: var(--ink);
      background: #fff2f8;
      border: 1px solid var(--line);
    }
    .upload-wrap {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: #fff9fc;
    }
    .thumb {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: none;
      margin-top: 8px;
    }
    .profile-item {
      display: grid;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      margin-top: 12px;
    }
    .profile-item img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff3f9;
    }
    @media (max-width: 620px) {
      header { font-size: .82rem; }
      .card { padding: 14px 14px 12px; }
      .inline-row { display: grid; }
    }
  </style>
</head>
<body>
  <header>Satisfaction for U · Admin Console</header>
  <main>
    <section id="loginBox" class="card login">
      <h1>Admin Login</h1>
      <p>Use the admin username and password configured in Cloudflare.</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>

        <label for="password" style="margin-top:12px;">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <div class="inline-row" style="margin-top:16px;">
          <button type="submit">Login</button>
        </div>
      </form>
      <div id="loginStatus" class="status hidden"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card">
        <h1>Admin Dashboard</h1>
        <p>Changes are saved to Cloudflare KV.</p>
        <div class="inline-row">
          <button id="refreshBtn" class="secondary" type="button">Refresh</button>
          <button id="logoutBtn" class="danger" type="button">Logout</button>
        </div>
        <div id="status" class="status"></div>
      </div>

      <div class="card">
        <h2>Homepage Settings</h2>
        <form id="settingsForm">
          <div class="grid">
            <div><label>Website Name</label><input name="brand"></div>
            <div><label>Hero Eyebrow</label><input name="heroEyebrow"></div>
            <div><label>Main Heading</label><input name="heroTitle"></div>
            <div><label>Hero Description</label><textarea name="heroDescription"></textarea></div>
            <div><label>Why Section Title</label><input name="whyTitle"></div>
            <div><label>Why Section Description</label><textarea name="whyDescription"></textarea></div>
            <div><label>SEO Title</label><input name="seoTitle"></div>
            <div><label>SEO Description</label><textarea name="seoDescription"></textarea></div>
          </div>

          <div class="upload-wrap">
            <label>Hero Background Photo</label>
            <input type="file" accept="image/*" data-upload-target="heroBackground">
            <input id="heroBackground" name="heroBackground" placeholder="Image URL or data URL">
            <img id="heroBackgroundThumb" class="thumb" alt="Hero Background Preview">
          </div>

          <div class="upload-wrap">
            <label>Why Section Background Photo</label>
            <input type="file" accept="image/*" data-upload-target="whyBackground">
            <input id="whyBackground" name="whyBackground" placeholder="Image URL or data URL">
            <img id="whyBackgroundThumb" class="thumb" alt="Why Background Preview">
          </div>

          <div class="inline-row" style="margin-top:16px;">
            <button type="submit">Save Homepage Settings</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Add / Edit Profile</h2>
        <form id="profileForm">
          <div class="grid">
            <div><label>Unique Profile ID</label><input name="id" required placeholder="profile-001"></div>
            <div><label>Name</label><input name="name" required></div>
            <div><label>Location</label><input name="location"></div>
            <div><label>Phone</label><input name="phone"></div>
            <div><label>WhatsApp</label><input name="whatsapp"></div>
            <div style="grid-column: 1 / -1;"><label>Description</label><textarea name="description"></textarea></div>
          </div>

          <div class="upload-wrap">
            <label>Profile Photo (gallery upload)</label>
            <input type="file" accept="image/*" data-upload-target="photo">
            <input id="photo" name="photo" placeholder="https://... or data:image/...">
            <img id="photoThumb" class="thumb" alt="Profile Photo Preview">
          </div>

          <div class="inline-row" style="margin-top:16px;">
            <button type="submit">Save Profile</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Existing Profiles</h2>
        <div id="profiles">Loading…</div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let token = sessionStorage.getItem("sfu_admin_token") || "";
    const MAX_PROFILE_PHOTO_BYTES = 500000;
    const MAX_BACKGROUND_IMAGE_BYTES = 1200000;

    function estimateDataUrlBytes(dataUrl) {
      if (!dataUrl || typeof dataUrl !== "string") return 0;
      if (!dataUrl.startsWith("data:")) return 0;
      return Math.ceil((dataUrl.length * 3) / 4);
    }

    function validateImageInput(value, maxBytes, label) {
      if (!value) return value;
      const trimmed = String(value).trim();
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      if (!trimmed.startsWith("data:image/")) return trimmed;
      const size = estimateDataUrlBytes(trimmed);
      if (size > maxBytes) {
        throw new Error(`${label} must be ${Math.round(maxBytes / 1000)} KB or smaller.`);
      }
      return trimmed;
    }

    function status(id, msg, error = false) {
      const el = $(id);
      if (!el) return;
      el.textContent = msg;
      el.classList.remove("hidden");
      el.style.background = error ? "#ffe8ee" : "#fff2f8";
    }

    async function api(path, opts = {}) {
      const headers = new Headers(opts.headers || {});
      headers.set("Content-Type", "application/json");
      if (token) headers.set("Authorization", "Bearer " + token);

      const res = await fetch(path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed.");
      return data;
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Image read failed."));
        reader.readAsDataURL(file);
      });
    }

    function setupUploadField(input) {
      const target = input.dataset.uploadTarget;
      if (!target) return;
      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const max = target === "photo" ? MAX_PROFILE_PHOTO_BYTES : MAX_BACKGROUND_IMAGE_BYTES;
          const label = target === "photo" ? "Profile photo" : "Background image";
          if (file.size > max) {
            throw new Error(`${label} must be ${Math.round(max / 1000)} KB or smaller.`);
          }
          const dataUrl = await readFileAsDataUrl(file);
          const size = estimateDataUrlBytes(dataUrl);
          if (size > max) {
            throw new Error(`${label} must be ${Math.round(max / 1000)} KB or smaller.`);
          }
          const targetInput = document.getElementById(target);
          if (targetInput) targetInput.value = dataUrl;
          const thumb = document.getElementById(target + "Thumb");
          if (thumb) {
            thumb.src = dataUrl;
            thumb.style.display = "block";
          }
          status("status", `${label} loaded successfully.`);
        } catch (err) {
          status("status", err.message || "Image upload failed.", true);
          const targetInput = document.getElementById(target);
          if (targetInput) targetInput.value = "";
          const thumb = document.getElementById(target + "Thumb");
          if (thumb) {
            thumb.style.display = "none";
            thumb.src = "";
          }
          input.value = "";
        }
      });
    }

    document.querySelectorAll("input[data-upload-target]").forEach(setupUploadField);

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      status("loginStatus", "Signing in…");
      try {
        const body = {
          username: $("username").value,
          password: $("password").value
        };
        const res = await api("/api/login", { method: "POST", body: JSON.stringify(body) });
        token = res.token || "";
        sessionStorage.setItem("sfu_admin_token", token);
        $("loginBox").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        await loadData();
        status("status", "Login successful.");
      } catch (err) {
        status("loginStatus", err.message || "Login failed.", true);
      }
    });

    function fill(s) {
      for (const el of $("settingsForm").elements) {
        if (el.name) {
          el.value = s[el.name] || "";
          if (el.id && (el.id === "heroBackground" || el.id === "whyBackground" || el.id === "photo")) {
            const thumb = document.getElementById(el.id + "Thumb");
            if (thumb && el.value) {
              thumb.src = el.value;
              thumb.style.display = "block";
            }
          }
        }
      }
    }

    async function loadData() {
      try {
        const d = await api("/api/admin/data");
        fill(d.settings || {});
        render(d.profiles || []);
        status("status", "Data loaded.");
      } catch (err) {
        status("status", err.message || "Could not load data.", true);
        if (/session|expired|sign in/i.test(err.message || "")) {
          token = "";
          sessionStorage.removeItem("sfu_admin_token");
          $("dashboard").classList.add("hidden");
          $("loginBox").classList.remove("hidden");
        }
      }
    }

    function render(ps) {
      const box = $("profiles");
      box.innerHTML = "";
      if (!ps.length) {
        box.textContent = "No profiles yet.";
        return;
      }
      for (const p of ps) {
        const row = document.createElement("div");
        row.className = "profile-item";
        row.innerHTML = `
          ${p.photo ? `<img src="${p.photo}" alt="${p.name}">` : ""}
          <div><strong>${p.name || "Untitled"}</strong></div>
          <div>ID: ${p.id || "—"}</div>
          <div>Location: ${p.location || "—"}</div>
          <div>Phone: ${p.phone || "—"}</div>
          <div>WhatsApp: ${p.whatsapp || "—"}</div>
          <div>${p.description || ""}</div>
          <button type="button" class="secondary" data-delete-id="${p.id}">Delete</button>
        `;
        box.appendChild(row);
      }

      box.querySelectorAll("[data-delete-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-delete-id");
          try {
            await api("/api/admin/profiles", { method: "DELETE", body: JSON.stringify({ id }) });
            status("status", "Profile deleted.");
            await loadData();
          } catch (err) {
            status("status", err.message || "Delete failed.", true);
          }
        });
      });
    }

    $("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const settings = {};
      for (const el of e.currentTarget.elements) {
        if (el.name) settings[el.name] = el.value;
      }
      try {
        settings.heroBackground = validateImageInput(settings.heroBackground, MAX_BACKGROUND_IMAGE_BYTES, "Hero background image");
        settings.whyBackground = validateImageInput(settings.whyBackground, MAX_BACKGROUND_IMAGE_BYTES, "Why background image");
        await api("/api/admin/settings", {
          method: "PUT",
          body: JSON.stringify({ settings })
        });
        status("status", "Homepage settings saved.");
      } catch (err) {
        status("status", err.message || "Save failed.", true);
      }
    });

    $("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.currentTarget;
      const p = {};
      for (const key of ["id", "name", "location", "photo", "phone", "whatsapp", "description"]) {
        p[key] = f.elements.namedItem(key)?.value || "";
      }
      try {
        p.photo = validateImageInput(p.photo, MAX_PROFILE_PHOTO_BYTES, "Profile photo");
        await api("/api/admin/profiles", {
          method: "PUT",
          body: JSON.stringify({ profile: p })
        });
        status("status", "Profile saved.");
        f.reset();
        ["photoThumb", "heroBackgroundThumb", "whyBackgroundThumb"].forEach((id) => {
          const el = $(id);
          if (el) {
            el.style.display = "none";
            el.src = "";
          }
        });
        await loadData();
      } catch (err) {
        status("status", err.message || "Profile save failed.", true);
      }
    });

    $("refreshBtn").onclick = loadData;
    $("logoutBtn").onclick = () => {
      token = "";
      sessionStorage.removeItem("sfu_admin_token");
      $("dashboard").classList.add("hidden");
      $("loginBox").classList.remove("hidden");
      $("loginStatus").classList.add("hidden");
      $("password").value = "";
    };

    if (token) {
      $("loginBox").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      loadData();
    }
  </script>
</body>
</html>
